AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Scrap Overflow serverless backend

Globals:
  Function:
    Runtime: python3.14
    Architectures:
      - arm64
    MemorySize: 512
    Timeout: 10
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: scrap-overflow
        LOG_LEVEL: INFO

Resources:
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: api/
      Handler: app.lambda_handler
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Events:
        Health:
          Type: Api
          Properties:
            Path: /health
            Method: get
# --- Items ---
        CreateItem:
          Type: Api
          Properties:
            Path: /items
            Method: post
        ListItems:
          Type: Api
          Properties:
            Path: /items
            Method: get
        GetItem:
          Type: Api
          Properties:
            Path: /items/{item_id}
            Method: get
        UpdateItem:
          Type: Api
          Properties:
            Path: /items/{item_id}
            Method: patch
        DeleteItem:
          Type: Api
          Properties:
            Path: /items/{item_id}
            Method: delete
# --- Projects ---
        CreateProject:
          Type: Api
          Properties:
            Path: /projects
            Method: post
        ListProjects:
          Type: Api
          Properties:
            Path: /projects
            Method: get
        GetProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}
            Method: get
        UpdateProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}
            Method: patch
        ChangeProjectStatus:
          Type: Api
          Properties:
            Path: /projects/{project_id}/status
            Method: post
        PublishProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}/publish
            Method: post
        UnpublishProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}/publish
            Method: delete
        DeleteProject:
          Type: Api
          Properties:
            Path: /projects/{project_id}
            Method: delete
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref DBTable
      Environment:
        Variables:
          TABLE_NAME: !Ref DBTable
          DEV_MAKER_ID: m-dev
  DBTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: "N"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true

Outputs:
  # ServerlessRestApi is an implicit API created out of Events key under Serverless::Function
  HealthApi:
    Description: API Gateway endpoint URL for Prod stage for API function
    Value: !Sub https://${ServerlessRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/Prod/health/
  ApiFunction:
    Description: Api Lambda Function ARN
    Value: !GetAtt ApiFunction.Arn
  ApiFunctionIamRole:
    Description: Implicit IAM Role created for API function
    Value: !GetAtt ApiFunctionRole.Arn
